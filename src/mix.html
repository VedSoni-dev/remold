<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mix</title>
  <link rel="icon" href="../icons/32.png" />
  <link rel="stylesheet" href="mix.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="head">
        <img src="../icons/48.png" alt="" class="logo" />
        <input class="title" aria-label="Mix name" spellcheck="false" />
      </div>
      <div class="lbl">Sources · this tab group</div>
      <ul class="sources"></ul>
      <p class="hint">Drag more tabs into this group to add sources. They stay open; this tab reads them.</p>
      <div class="lbl">Ask</div>
      <div class="chat"></div>
      <form class="ask">
        <textarea name="q" rows="3" placeholder="What do you want from these tabs?"></textarea>
        <div class="row">
          <label class="live"><input type="checkbox" name="live" /> Live · rebuild every 2 min</label>
          <button class="go" type="submit">Build</button>
        </div>
      </form>
    </aside>
    <main class="stage">
      <canvas class="swarm"></canvas>
      <div class="view"></div>
    </main>
  </div>
  <script type="module" src="mix.js"></script>
</body>
</html>
