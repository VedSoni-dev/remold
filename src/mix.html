<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mix</title>
  <link rel="icon" href="../icons/32.png" />
  <link rel="stylesheet" href="mix.css" />
  <style id="user-css"></style>
</head>
<body>
  <div class="mix">
    <header class="bar">
      <input class="title" aria-label="Mix name" spellcheck="false" />
      <div class="layouts" role="group" aria-label="Layout">
        <button data-layout="columns" title="Columns"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="5.5" height="11" rx="1.5"/><rect x="9" y="2.5" width="5.5" height="11" rx="1.5"/></svg></button>
        <button data-layout="rows" title="Rows"><svg viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="5.5" rx="1.5"/><rect x="1.5" y="8.5" width="13" height="5.5" rx="1.5"/></svg></button>
        <button data-layout="grid" title="Grid"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.3"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.3"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.3"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.3"/></svg></button>
        <button data-layout="focus" title="Focus"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="8.5" height="11" rx="1.5"/><rect x="11.5" y="2.5" width="3" height="5" rx="1"/><rect x="11.5" y="8.5" width="3" height="5" rx="1"/></svg></button>
      </div>
      <form class="ask">
        <input name="q" placeholder="Describe the mix… e.g. “X narrow on the left, YouTube big, add Hacker News”" autocomplete="off" />
        <span class="status" aria-live="polite"></span>
      </form>
      <button class="add" title="Add a site">+ Site</button>
      <button class="unmix" title="Split back into tabs">Unmix</button>
    </header>
    <section class="panes"></section>
  </div>
  <script type="module" src="mix.js"></script>
</body>
</html>
